name = "langtonsant"
version = "0.1.0"
defaultTargets = ["LangtonsAnt"]

[[lean_lib]]
name = "LangtonsAnt"
roots = ["LangtonsAnt", "FiniteAnt", "Highway", "HighwayChecker", "StandardHighway", "PackedAnt", "BlankHighway", "Symmetry", "TrajectoryCoupling", "HighwayEntrance", "EntranceChecker", "SeparatedInitialStates", "DelayedHighway", "FirstContact", "FirstContactDecision", "SingleFlipReduction", "CollisionRecovery", "HighwayRecovery", "FreshCollision", "DelayedRecovery", "PackedFinite", "RecoveryCertificate", "MaturePhaseRecovery", "MaskedAgreement", "ObstacleChain", "MultipleObstacles", "InfiniteObstacleHighway", "InfiniteHighwayPeriod", "InfiniteChainLimit", "SpacedObstacleHighway", "SpacedHighwayWord", "SpacedHighwayPeriod", "SpacedHighwayClassification", "VariableObstacleBlock", "VariableFiniteObstacles", "VariableInfiniteObstacles", "AperiodicObstacleChain", "VariableChainLimit", "VariableFirstVisits", "VariableRecoveryBounds", "ExactVariableRecovery", "FreshObstacleReduction", "BoundedMemory", "Ballistic", "FreshPhases", "RotatedRecovery", "WidePacked"]

# The recovery certificates perform long kernel computations; build explicitly.
[[lean_lib]]
name = "FreshRecovery"
roots = ["FreshPhaseRecovery", "HardPhaseRecovery", "TrailRetrace", "SingleBlackLate", "SingleBlackCheck",
  "FastCell", "FastCell2", "FastCell3", "SegmentCheck", "TreeBoard", "SingleBlackCover", "Phase49Data",
  "Phase49P1", "Phase49K1", "Phase49P2", "Phase49K2", "Phase49P3", "Phase49K3", "Phase49Blank"]

# Kernel-checked certificates for the 2215 single black cells visited early by the blank orbit.
# Generated by scripts/gen_single_black*.py and scripts/gen_segments.py; about 33 million checked steps.
# Do not build this library with plain `lake build`: Lake compiles many modules at once and each
# kernel check needs 1-2 GB.  Use scripts/build_cells.py (bounded memory) for the cell modules.
[[lean_lib]]
name = "SingleBlackEarly"
globs = ["SingleBlackEarly.*"]

# The single black cell theorem.  Importing it requires every SingleBlackEarly module; build those
# first with scripts/build_cells.py, never by `lake build` of this target on a machine with < 16 GB.
[[lean_lib]]
name = "SingleBlackFull"
roots = ["SingleBlackTheorem"]
